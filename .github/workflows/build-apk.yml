name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Capacitor CLI
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Extract App Name & Generate Dynamic Package ID
        id: app_info
        run: |
          # Extract name from package.json (or fallback to 'MobileApp')
          APP_NAME=$(jq -r '.name // "MobileApp"' package.json | tr -cd 'a-zA-Z0-9')
          # Convert name to lowercase for a valid Java package ID
          PKG_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')
          
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "PKG_ID=com.app.$PKG_NAME" >> $GITHUB_ENV

      - name: Initialize Capacitor & Add Android Platform
        run: |
          bunx cap init "${{ env.APP_NAME }}" "${{ env.PKG_ID }}" --web-dir dist || true
          bunx cap add android || true
          if [ -f "icon.png" ]; then bunx @capacitor/assets generate --android; fi
          bunx cap copy android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
